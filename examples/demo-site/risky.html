<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:0;padding:16px;max-width:640px}nav a{margin-right:10px}input,textarea{display:block;width:100%;margin:6px 0;padding:8px;font:inherit}button{padding:12px 18px;font:inherit}form{border:1px solid #ddd;padding:8px;margin:12px 0}</style><title>Blog and shop</title></head><body><nav><a href="/">Home</a> <a href="/contact.html">Contact</a></nav><h1>Blog and shop extras</h1>
